# Gradle daemon heap, sized for this machine rather than a build server.
# The previous value (-Xmx8G -XX:MaxMetaspaceSize=4G) permitted ~12G on a
# 7.4G laptop, so the JVM grew instead of collecting until the kernel OOM
# killer took the build (exit 137) - and on one run, VS Code with it.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# The Kotlin compiler forks its own daemon; without this it claims a second
# large heap alongside the Gradle daemon.
kotlin.daemon.jvmargs=-Xmx1G

# Stop R8, dexing and Kotlin compilation from all peaking simultaneously.
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
