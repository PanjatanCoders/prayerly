name: prayerly
description: "Prayerly app"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.6.0+14

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  intl: ^0.20.2
  geocoding: ^4.0.0
  http: ^1.2.2
  flutter_launcher_icons: ^0.14.4
  marquee: ^2.3.0
  awesome_notifications: ^0.10.1
  audioplayers: ^6.5.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  package_info_plus: ^8.3.0
  flutter_compass: ^0.8.1
  flutter_localizations:
    sdk: flutter
  flutter_gen: ^5.12.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    # The system/device fallback font for Arabic script does not reliably
    # render a shadda stacked with a vowel mark on the same letter (e.g.
    # صَلِّ's shadda+kasra) - confirmed on-device: it shows some other glyph
    # (reported as a fatha) or drops the vowel mark entirely, regardless of
    # the marks' order in the string (Arabic combining-mark order itself was
    # independently verified correct per Unicode's canonical combining
    # classes - kasra then shadda is already canonical). Amiri is a classical
    # Naskh typeface built for exactly this (full Qur'anic/classical
    # diacritic stacking), SIL Open Font License, used wherever this app
    # renders Dhikr/Durood Arabic text.
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

  assets:
    - assets/icons/icon.png
    - assets/icons/icon_foreground.png
    - assets/images/hero_prayer_bg.jpg
    - assets/images/world_map.jpg
    - assets/audio/adhan/azan1.mp3
    - assets/audio/adhan/azan2.mp3
    - assets/audio/adhan/azan3.mp3
    - assets/audio/adhan/azan4.mp3
    - assets/audio/adhan/azan_fajr1.mp3
flutter_icons:
  android: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  adaptive_icon_background: "#0A0A0A"
# flutter pub run flutter_launcher_icons:main

